name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check apps/api scripts/e2e_database.py
      - run: uv run ruff format --check apps/api scripts/e2e_database.py
      - run: uv run mypy
      - run: uv run pytest -m "not integration and not live"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: docker compose up --detach --wait db
      - run: uv run pytest -m integration
        env:
          DATABASE_URL: postgresql://ai_atlas:ai_atlas_dev@127.0.0.1:5432/ai_atlas
      - if: always()
        run: docker compose down --volumes

  discover-e2e:
    name: Discover E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-groups --frozen
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Start disposable PostgreSQL
        run: docker compose up --detach --wait db
      - name: Run Discover E2E
        timeout-minutes: 15
        env:
          CI: "true"
          E2E_DATABASE_ADMIN_URL: postgresql://ai_atlas:ai_atlas_dev@127.0.0.1:5432/ai_atlas
          E2E_STARTUP_TIMEOUT_MS: "60000"
        run: pnpm test:e2e:discover
      - name: Upload Discover E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discover-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/discover-e2e/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Tear down Discover E2E
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -rf apps/web/.next-e2e
